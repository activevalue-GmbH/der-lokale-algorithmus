<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KStA.Connect | Präsentationsstruktur Offsite</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Arbeitsfassung der Offsite-Präsentation zu KStA.Connect.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #c8000e;
      --ink: #1c1917;
      --body: #3d3a38;
      --muted: #77716c;
      --paper: #fafaf8;
      --paper-2: #f2f0ed;
      --warm: #f5e6d3;
      --blue: #526d82;
      --green: #66765f;
      --line: rgba(28, 25, 23, 0.16);
      --line-dark: rgba(250, 250, 248, 0.16);
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "DM Sans", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--body);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button {
      border: 0;
      font: inherit;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--paper);
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(14px, 2vw, 28px);
      padding: clamp(24px, 4.1vw, 58px);
      background: var(--paper);
      opacity: 0;
      pointer-events: none;
      transform: translateX(28px);
      transition: opacity 300ms ease, transform 300ms ease;
    }

    .slide.is-active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .slide.dark {
      background: var(--ink);
      color: rgba(250, 250, 248, 0.82);
    }

    .slide.grey {
      background: var(--paper-2);
    }

    .slide.warm {
      background: linear-gradient(180deg, var(--paper), var(--warm));
    }

    .slide.red {
      background: var(--red);
      color: rgba(250, 250, 248, 0.84);
    }

    .red .topline,
    .red .footline {
      color: rgba(250, 250, 248, 0.58);
    }

    .red .kicker {
      color: rgba(250, 250, 248, 0.84);
    }

    .red h1,
    .red h2,
    .red .statement,
    .red .quote,
    .red .persona-name,
    .red .block-number {
      color: var(--paper);
    }

    .topline,
    .footline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 700;
      letter-spacing: 0.13em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .dark .topline,
    .dark .footline {
      color: rgba(250, 250, 248, 0.55);
    }

    .footline {
      justify-content: flex-end;
    }

    .brand span {
      color: var(--red);
      margin-right: 7px;
    }

    .content {
      display: grid;
      align-content: center;
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: clamp(18px, 3vw, 40px) 0;
    }

    .content.narrow {
      width: min(100%, 930px);
    }

    .content.top {
      align-content: start;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(330px, 0.8fr);
      gap: clamp(34px, 5.2vw, 78px);
      align-items: center;
    }

    .split.split-bullets-compact {
      align-items: start;
    }

    .split.split-bullets-compact h2 {
      font-size: clamp(31px, 4vw, 56px);
      line-height: 1.03;
    }

    .split.split-bullets-compact .split-bullets {
      gap: clamp(10px, 1.1vw, 15px);
      font-size: clamp(15.5px, 1.12vw, 18px);
      line-height: 1.33;
    }

    .split.split-headline-compact h2 {
      max-width: 960px;
      font-size: clamp(34px, 4.55vw, 64px);
      line-height: 1.02;
    }

    .kicker {
      display: block;
      margin-bottom: clamp(16px, 2vw, 26px);
      color: var(--red);
      font-size: clamp(13px, 1.35vw, 16px);
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    h1,
    h2,
    .statement,
    .quote,
    .persona-name,
    .block-number {
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 400;
      letter-spacing: 0;
    }

    .dark h1,
    .dark h2,
    .dark .statement,
    .dark .quote,
    .dark .persona-name,
    .dark .block-number {
      color: var(--paper);
    }

    h1 {
      max-width: 1040px;
      font-size: clamp(50px, 7.7vw, 114px);
      line-height: 0.96;
    }

    h1 em,
    h2 em,
    .statement em {
      color: rgba(28, 25, 23, 0.32);
      font-style: italic;
    }

    .dark h1 em,
    .dark h2 em,
    .dark .statement em {
      color: rgba(250, 250, 248, 0.34);
    }

    h2,
    .statement {
      max-width: 1040px;
      font-size: clamp(36px, 5vw, 72px);
      line-height: 1.04;
    }

    .statement-marker {
      display: inline-grid;
      place-items: center;
      width: clamp(42px, 4.3vw, 58px);
      height: clamp(42px, 4.3vw, 58px);
      margin-bottom: clamp(18px, 2.2vw, 28px);
      border: 1px solid rgba(200, 0, 14, 0.72);
      border-radius: 999px;
      color: var(--red);
      font-family: var(--sans);
      font-size: clamp(22px, 2.2vw, 30px);
      font-weight: 500;
      line-height: 1;
    }


    .quote-cloud-content {
      width: min(100%, 1180px);
      align-content: center;
    }

    .quote-cloud-header {
      max-width: 760px;
      margin-bottom: clamp(22px, 3vw, 38px);
    }

    .quote-cloud-header h2 {
      max-width: 820px;
      font-size: clamp(34px, 4.6vw, 66px);
      line-height: 1.02;
    }

    .quote-cloud-header .lead {
      max-width: 700px;
      margin-top: clamp(16px, 2vw, 24px);
    }

    .quote-cloud-stage {
      position: relative;
      height: clamp(430px, 47vw, 530px);
      border-top: 1px solid rgba(28, 25, 23, 0.12);
      border-bottom: 1px solid rgba(28, 25, 23, 0.08);
      overflow: hidden;
    }

    .quote-cloud-phrase {
      position: absolute;
      left: var(--x);
      top: var(--y);
      max-width: var(--w, 420px);
      color: rgba(28, 25, 23, var(--a, 0.82));
      font-family: var(--serif);
      font-size: var(--s);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: -0.015em;
      transform: translate(-50%, -50%) rotate(var(--r, 0deg));
      white-space: normal;
    }

    .quote-cloud-phrase.tone-strong { --a: 1; }
    .quote-cloud-phrase.tone-medium { --a: 0.74; }
    .quote-cloud-phrase.tone-soft { --a: 0.56; }
    .quote-cloud-phrase.tone-red { color: rgba(200, 0, 14, 0.84); }

    .quote-cloud-phrase::before,
    .quote-cloud-phrase::after {
      color: rgba(200, 0, 14, 0.34);
    }

    .quote-cloud-phrase::before { content: "„"; }
    .quote-cloud-phrase::after { content: "“"; }

    .dark .statement-marker {
      border-color: rgba(250, 250, 248, 0.28);
      color: var(--paper);
    }

    .lead {
      max-width: 760px;
      margin-top: clamp(22px, 2.6vw, 36px);
      color: var(--body);
      font-size: clamp(19px, 1.7vw, 26px);
      font-weight: 300;
      line-height: 1.43;
    }

    .dark .lead {
      color: rgba(250, 250, 248, 0.64);
    }

    .cards-lead {
      max-width: 880px;
      margin-top: clamp(16px, 1.8vw, 24px);
      font-size: clamp(18px, 1.35vw, 22px);
    }

    .cards-outro {
      max-width: 920px;
      margin-top: clamp(22px, 2.4vw, 32px);
      color: var(--body);
      font-size: clamp(18px, 1.35vw, 22px);
      font-weight: 500;
      line-height: 1.42;
    }

    .dark .cards-outro {
      color: rgba(250, 250, 248, 0.72);
    }

    .title-details {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, auto));
      gap: clamp(18px, 3vw, 42px);
      max-width: 900px;
      margin-top: clamp(42px, 5vw, 76px);
      padding-top: clamp(22px, 2.4vw, 32px);
      border-top: 1px solid var(--line-dark);
    }

    .title-details span {
      display: block;
      color: rgba(250, 250, 248, 0.36);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .title-details strong {
      display: block;
      margin-top: 7px;
      color: rgba(250, 250, 248, 0.78);
      font-size: clamp(14px, 1.05vw, 17px);
      font-weight: 400;
      line-height: 1.35;
    }

    .copy {
      display: grid;
      gap: 17px;
      max-width: 720px;
      color: var(--body);
      font-size: clamp(17px, 1.32vw, 21px);
      font-weight: 300;
      line-height: 1.56;
    }

    .dark .copy {
      color: rgba(250, 250, 248, 0.64);
    }

    .split-bullets {
      display: grid;
      gap: clamp(16px, 1.7vw, 24px);
      max-width: 760px;
      margin: 0;
      padding-left: 1.08em;
      color: var(--body);
      font-size: clamp(19px, 1.45vw, 24px);
      font-weight: 300;
      line-height: 1.43;
    }

    .dark .split-bullets {
      color: rgba(250, 250, 248, 0.66);
    }

    .split-bullets li::marker {
      color: var(--red);
    }

    .agenda-stack {
      display: grid;
      gap: clamp(12px, 1.45vw, 18px);
      max-width: 1060px;
      margin-top: clamp(22px, 2.4vw, 34px);
    }

    .agenda-block {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: clamp(18px, 2.4vw, 34px);
      align-items: start;
      padding-left: 0;
      border-left: 0;
    }

    .agenda-heading {
      display: grid;
      gap: 9px;
      align-items: start;
      justify-items: start;
    }

    .agenda-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 10px;
      background: rgba(28, 25, 23, 0.08);
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .agenda-heading strong {
      color: var(--ink);
      font-size: clamp(17px, 1.35vw, 21px);
      font-weight: 700;
      line-height: 1.2;
    }

    .agenda-lines {
      display: grid;
      gap: 9px;
      padding-left: clamp(18px, 2.4vw, 34px);
      border-left: 2px solid var(--red);
      color: var(--body);
      font-size: clamp(17px, 1.42vw, 22px);
      font-weight: 700;
      line-height: 1.24;
    }

    .agenda-block.is-hidden .agenda-lines {
      visibility: hidden;
    }

    .agenda-block.is-future .agenda-heading {
      opacity: 0.58;
    }

    .agenda-block.is-current .agenda-heading {
      opacity: 1;
    }

    .agenda-block.is-current .agenda-tag {
      background: rgba(200, 0, 14, 0.1);
    }

    .agenda-stack.is-compact {
      gap: clamp(14px, 1.8vw, 24px);
      max-width: 840px;
      margin-top: clamp(24px, 3vw, 42px);
    }

    .agenda-stack.is-compact .agenda-block {
      grid-template-columns: 1fr;
      padding: clamp(18px, 2vw, 28px) clamp(20px, 2.6vw, 34px);
      border: 1px solid var(--line);
      background: rgba(250, 250, 248, 0.76);
    }

    .agenda-stack.is-compact .agenda-heading {
      grid-template-columns: minmax(64px, max-content) minmax(0, 1fr);
      align-items: baseline;
      gap: clamp(18px, 2.4vw, 34px);
    }

    .agenda-stack.is-compact .agenda-tag {
      justify-content: center;
      min-width: 46px;
      background: rgba(200, 0, 14, 0.12);
    }

    .agenda-stack.is-compact .agenda-heading strong {
      font-family: var(--serif);
      font-size: clamp(28px, 3.2vw, 46px);
      font-weight: 400;
      line-height: 1.04;
    }

    .evidence-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.78fr) minmax(340px, 1fr);
      gap: clamp(36px, 5.4vw, 78px);
      align-items: center;
    }

    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .evidence-card.wide-red {
      grid-column: 1 / -1;
      min-height: 170px;
      background: var(--red);
    }

    .evidence-card.wide-red span,
    .evidence-card.wide-red strong,
    .evidence-card.wide-red em,
    .evidence-card.wide-red small {
      color: var(--paper);
    }

    .evidence-card.wide-red strong {
      max-width: 720px;
      font-size: clamp(30px, 3vw, 44px);
      line-height: 1.04;
    }

    .evidence-card.soft-red {
      background: rgba(200, 0, 14, 0.08);
    }

    .evidence-card.dark {
      background: var(--ink);
    }

    .evidence-card.dark span {
      color: rgba(250, 250, 248, 0.74);
    }

    .evidence-card.dark strong {
      color: var(--paper);
    }

    .evidence-card.dark em,
    .evidence-card.dark small {
      color: rgba(250, 250, 248, 0.72);
    }

    .evidence-card {
      display: grid;
      gap: 10px;
      min-height: 140px;
      padding: clamp(20px, 2.2vw, 30px);
      background: rgba(250, 250, 248, 0.84);
    }

    .evidence-card span {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .evidence-card strong {
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(22px, 2vw, 30px);
      font-weight: 400;
      line-height: 1.12;
    }

    .evidence-card small {
      color: var(--muted);
      font-size: clamp(13px, 1vw, 16px);
      line-height: 1.45;
    }

    .evidence-card em {
      color: var(--body);
      font-size: clamp(13px, 1vw, 15px);
      font-style: normal;
      font-weight: 600;
      line-height: 1.4;
    }

    .evidence-card.highlight {
      background: var(--ink);
    }

    .evidence-card.highlight span {
      color: rgba(200, 0, 14, 0.9);
    }

    .evidence-card.highlight strong {
      color: var(--paper);
    }

    .evidence-card.highlight em {
      color: rgba(250, 250, 248, 0.54);
    }

    .evidence-card.highlight small {
      color: rgba(250, 250, 248, 0.72);
    }

    .source-strip {
      margin-top: clamp(24px, 3vw, 40px);
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: clamp(12px, 0.95vw, 14px);
      font-weight: 300;
      line-height: 1.6;
    }

    .jtbd-mirror {
      align-content: center;
    }

    .jtbd-mirror h2 {
      max-width: 940px;
      font-size: clamp(30px, 3.6vw, 52px);
      line-height: 1.08;
    }

    .jtbd-mirror .lead {
      max-width: 780px;
      margin-top: 14px;
      font-size: clamp(15px, 1.25vw, 18px);
    }

    .mirror-grid {
      display: grid;
      gap: 0;
      margin-top: clamp(24px, 3vw, 42px);
      border-top: 2px solid var(--ink);
    }

    .mirror-row,
    .mirror-head {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(110px, 0.48fr) minmax(0, 1.48fr) minmax(0, 1.32fr);
      column-gap: clamp(12px, 1.5vw, 22px);
    }

    .mirror-head {
      padding: 10px 0 9px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mirror-row {
      padding: clamp(9px, 1.05vw, 14px) 0;
      border-bottom: 1px solid var(--line);
      color: var(--body);
      font-size: clamp(11px, 0.95vw, 13px);
      font-weight: 500;
      line-height: 1.32;
    }

    .mirror-phenomenon {
      color: var(--ink);
      font-weight: 700;
    }

    .mirror-phenomenon em {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.88em;
      font-style: normal;
      font-weight: 400;
    }

    .mirror-source {
      color: var(--muted);
      font-style: italic;
    }

    .mirror-consequence strong {
      color: var(--ink);
      font-weight: 700;
    }

    .mirror-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid rgba(28, 25, 23, 0.16);
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .mirror-badge.confirmed {
      background: rgba(102, 118, 95, 0.13);
      color: var(--green);
    }

    .mirror-badge.nuanced {
      background: rgba(82, 109, 130, 0.12);
      color: var(--blue);
    }

    .list {
      display: grid;
      gap: clamp(12px, 1.4vw, 18px);
      list-style: none;
    }

    .list li {
      position: relative;
      padding-left: 24px;
      color: var(--body);
      font-size: clamp(17px, 1.45vw, 22px);
      font-weight: 300;
      line-height: 1.38;
    }

    .list li::before {
      content: "";
      position: absolute;
      top: 0.64em;
      left: 0;
      width: 7px;
      height: 7px;
      background: var(--red);
    }

    .dark .list li {
      color: rgba(250, 250, 248, 0.68);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .cards.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cards.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card {
      display: grid;
      align-content: start;
      gap: 12px;
      min-height: 154px;
      padding: clamp(20px, 2.2vw, 32px);
      background: rgba(250, 250, 248, 0.86);
    }

    .dark .card {
      background: rgba(250, 250, 248, 0.06);
      border-color: var(--line-dark);
    }

    .card.is-highlight {
      position: relative;
      background: rgba(229, 0, 28, 0.11);
      box-shadow: inset 0 0 0 1px rgba(229, 0, 28, 0.48);
    }

    .card.is-highlight::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--red);
    }

    .card.is-muted {
      opacity: 0.44;
      filter: grayscale(0.35);
    }

    .dark .card.is-highlight {
      background: rgba(229, 0, 28, 0.18);
      box-shadow: inset 0 0 0 1px rgba(229, 0, 28, 0.58);
    }

    .card small {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .card strong {
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(22px, 2vw, 30px);
      font-weight: 400;
      line-height: 1.12;
    }

    .dark .card strong {
      color: var(--paper);
    }

    .card span {
      color: var(--muted);
      font-size: clamp(14px, 1.05vw, 16px);
      line-height: 1.5;
    }

    .dark .card span {
      color: rgba(250, 250, 248, 0.62);
    }

    .card-bullets {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card-bullets li {
      position: relative;
      padding-left: 18px;
      color: var(--muted);
      font-size: clamp(14px, 1.05vw, 16px);
      line-height: 1.42;
    }

    .card-bullets li::before {
      content: "";
      position: absolute;
      top: 0.62em;
      left: 0;
      width: 6px;
      height: 6px;
      background: var(--red);
    }

    .dark .card-bullets li {
      color: rgba(250, 250, 248, 0.66);
    }

    .poc-scope {
      align-content: center;
      gap: clamp(22px, 2.6vw, 34px);
    }

    .poc-scope h2 {
      max-width: 1040px;
      font-size: clamp(40px, 5.1vw, 74px);
      line-height: 1.02;
    }

    .poc-scope-subline {
      max-width: 820px;
      color: var(--body);

    .cards.is-reveal .card.is-hidden,
    .cards-outro.is-hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .cards.is-reveal .card,
    .cards-outro {
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .cards.is-auto-reveal .card,
    .cards-outro.is-auto-reveal {
      opacity: 0;
      transform: translateY(14px);
    }

    .slide.is-active .cards.is-auto-reveal .card {
      animation: autoCardReveal 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(260ms + (var(--card-index, 0) * 560ms));
    }

    .slide.is-active .cards-outro.is-auto-reveal {
      animation: autoCardReveal 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--outro-delay, 3900ms);
    }

    @keyframes autoCardReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cards.is-auto-reveal .card,
      .cards-outro.is-auto-reveal {
        opacity: 1;
        transform: none;
      }

      .slide.is-active .cards-outro.is-auto-reveal {
        animation: none;
      }
    }

    .slide.avatar-video-slide {

    .slide.avatar-video-slide .topline,
    .slide.avatar-video-slide .footline {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 3;
      padding: clamp(22px, 3.2vw, 46px);
      color: rgba(250, 250, 248, 0.78);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.62);

    }

    .slide.avatar-video-slide .footline {
      bottom: 0;
    }

    .avatar-video-content {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      align-content: stretch;
    }

    .avatar-video-shell {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0b0a;
    }

    .avatar-video-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.42) 0%, rgba(0, 0, 0, 0.08) 25%, rgba(0, 0, 0, 0.06) 62%, rgba(0, 0, 0, 0.42) 100%),

    .avatar-video {
      display: block;

      height: 100%;

      object-position: center center;

      position: absolute;
      left: clamp(24px, 4.1vw, 58px);

    .notes-panel {
      position: fixed;

      max-height: 46vh;
      overflow: auto;
      padding: 18px 20px;
      border: 1px solid rgba(250, 250, 248, 0.22);

      position: fixed;
      inset: 0;
      z-index: 24;
      display: none;
      padding: clamp(22px, 4vw, 54px);
      overflow: auto;
      background: rgba(28, 25, 23, 0.96);
    }

    .overview.is-visible {
      display: block;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .overview button {
      min-height: 132px;
      padding: 18px;
      border: 1px solid rgba(250, 250, 248, 0.18);
      background: rgba(250, 250, 248, 0.06);
      color: rgba(250, 250, 248, 0.86);
      cursor: pointer;
      text-align: left;
    }

    .overview button:hover,
    .overview button:focus-visible {
      border-color: rgba(250, 250, 248, 0.38);
      outline: none;
    }

    .overview small {
      display: block;
      margin-bottom: 14px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .overview span {
      display: block;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.13;
    }

    .controls {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .control-button,
    .tool-button {
      display: grid;
      place-items: center;
      position: absolute;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(28, 25, 23, 0.14);
      background: rgba(250, 250, 248, 0.82);
      color: var(--ink);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .control-button {
      border-color: transparent;
      background: transparent;
      opacity: 0.34;
      top: 50%;
      transform: translateY(-50%);
      transition: opacity 150ms ease, transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .control-button[data-prev] {
      left: clamp(14px, 2.2vw, 30px);
    }

    .control-button[data-next] {
      right: clamp(14px, 2.2vw, 30px);
    }

    .tool-button {
      bottom: 18px;
      border-radius: 999px;
      font-size: 0;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .tool-button[data-overview] {
      left: 18px;
    }

    .tool-button[data-overview]::before {
      content: "";
      width: 15px;
      height: 15px;
      border: 2px solid currentColor;
      border-radius: 999px;
      transform: translate(-2px, -2px);
    }

    .tool-button[data-overview]::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 2px;
      background: currentColor;
      border-radius: 999px;
      transform: translate(8px, 8px) rotate(45deg);
    }

    .control-button:hover,
    .control-button:focus-visible,
    .tool-button:hover,
    .tool-button:focus-visible {
      border-color: rgba(28, 25, 23, 0.28);
      background: rgba(250, 250, 248, 0.98);
      outline: none;
    }

    .control-button:hover,
    .control-button:focus-visible {
      opacity: 1;
      transform: translateY(-50%) scale(1.04);
    }

    .dark .control-button {
      color: var(--paper);
    }

    .dark .control-button:hover,
    .dark .control-button:focus-visible {
      border-color: rgba(250, 250, 248, 0.18);
      background: rgba(250, 250, 248, 0.12);
    }

    .progress {

      background: rgba(28, 25, 23, 0.1);

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--red);
      transition: width 220ms ease;

              `).join("")}
            </div>
            ${slide.core ? `<p class="persona-callback-core">${escapeHtml(slide.core)}</p>` : ""}
          </div>`;
      }

      if (slide.kind === "split") {
        return `
          <div class="content split ${slide.compactHeadline ? "split-headline-compact" : ""} ${slide.compactBullets ? "split-bullets-compact" : ""}">
            <div>
              <span class="kicker">${escapeHtml(slide.kicker)}</span>
              <h2>${allowEm(slide.headline)}</h2>
            </div>
            ${slide.copyAsBullets
              ? `<ul class="split-bullets">${slide.copy.map((p) => `<li>${allowInline(p)}</li>`).join("")}</ul>`
              : `<div class="copy">${slide.copy.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}</div>`}
              ${slide.footnote ? `<p class="statement-footnote split-footnote">${escapeHtml(slide.footnote)}</p>` : ""}
          </div>`;
      }

      if (slide.kind === "cards") {
        const revealCount = slide.revealCards ? Math.max(0, slide.revealIndex ?? 0) : null;
        const outroDelayMs = slide.autoRevealCards ? 260 + (slide.cards.length * 560) : 0;
        return `
          <div class="content top">
            <span class="kicker">${escapeHtml(slide.kicker)}</span>
            <h2>${allowEm(slide.headline)}</h2>
            ${slide.lead ? `<p class="lead cards-lead ${slide.leadStyle === "arrow" ? "bridge-arrow-line" : ""}">${escapeHtml(slide.lead)}</p>` : ""}
            <div style="margin-top: clamp(26px, 3vw, 40px);">${cards(slide.cards, slide.columns, revealCount, Boolean(slide.autoRevealCards))}</div>
            ${slide.outro ? `<p class="cards-outro ${slide.revealCards && revealCount < slide.cards.length ? "is-hidden" : ""} ${slide.autoRevealCards ? "is-auto-reveal" : ""}" ${slide.autoRevealCards ? `style="--outro-delay: ${outroDelayMs}ms;"` : ""}>${escapeHtml(slide.outro)}</p>` : ""}
          </div>`;
      }

      if (slide.kind === "methodAgenda") {
        return `
          <div class="content top">
            <span class="kicker">${escapeHtml(slide.kicker)}</span>
            <h2>${escapeHtml(slide.headline)}</h2>
            <div class="method-agenda-grid">
              ${slide.steps.map(([num, title, body], stepIndex) => `
                <div class="method-agenda-card ${stepIndex === slide.active ? "is-active" : ""}">
                  <small>${escapeHtml(num)}</small>
                  <strong>${escapeHtml(title)}</strong>
                  <span>${escapeHtml(body)}</span>
                </div>
              `).join("")}
            </div>
            ${slide.outro ? `<p class="method-agenda-outro">${escapeHtml(slide.outro)}</p>` : ""}
          </div>`;
      }

      if (slide.kind === "principleChain") {
        return `
          <div class="content top">
            <span class="kicker">${escapeHtml(slide.kicker)}</span>
            <h2>${escapeHtml(slide.headline)}</h2>
            <div class="principle-chain">
              ${slide.items.map(([label, title, body]) => `
                <div class="principle-chain-row">
                  <div class="principle-chain-marker" aria-hidden="true">→</div>
                  <div class="principle-chain-copy">
                    <small>${escapeHtml(label)}</small>
                    <strong>${escapeHtml(title)}</strong>
                    <span>${escapeHtml(body)}</span>
                  </div>
                </div>
              `).join("")}
            </div>
            ${slide.outro ? `<p class="cards-outro">${escapeHtml(slide.outro)}</p>` : ""}
          </div>`;
      }

      if (slide.kind === "formula") {
        return `
          <div class="content narrow">
            <span class="kicker">${escapeHtml(slide.kicker)}</span>
            <h2>${escapeHtml(slide.headline)}</h2>
            <div class="formula" style="margin-top: clamp(26px, 3vw, 40px);">
              ${slide.lines.map(([label, text]) => `<div class="formula-line"><span>${escapeHtml(label)}</span><div>${escapeHtml(text)}</div></div>`).join("")}
            </div>
            ${slide.lead ? `<p class="lead">${escapeHtml(slide.lead)}</p>` : ""}
          </div>`;
      }

      if (slide.kind === "persona") {
        return `
          <div class="content">
            <span class="kicker">${escapeHtml(slide.kicker)}</span>
            <div class="persona">
              <div>
                <div class="persona-name">${escapeHtml(slide.name)}</div>
                <span class="persona-meta">${escapeHtml(slide.meta)}</span>
              </div>
              <div>
                <h2 style="font-size: clamp(32px, 4vw, 58px);">${escapeHtml(slide.headline)}</h2>
                <div class="copy" style="margin-top: clamp(20px, 2vw, 28px);">${slide.copy.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}</div>
              </div>
            </div>
          </div>`;
      }

      if (slide.kind === "timing") {
        return `
          <div class="content top">
            <span class="kicker">${escapeHtml(slide.kicker)}</span>
            <h2>${escapeHtml(slide.headline)}</h2>
            <div class="table" style="margin-top: clamp(24px, 2.6vw, 36px);">
              <div class="row">
                <div class="cell head">Block</div>
                <div class="cell head">Thema</div>
                <div class="cell head">Dauer</div>
              </div>
              ${slide.rows.map(([block, topic, time]) => `
                <div class="row">
                  <div class="cell">${escapeHtml(block)}</div>
                  <div class="cell">${escapeHtml(topic)}</div>
                  <div class="cell">${escapeHtml(time)}</div>
                </div>
              `).join("")}
            </div>
          </div>`;
      }


      if (slide.kind === "valueStairs") {
        return `
          <div class="content value-stairs">
            <span class="kicker">${escapeHtml(slide.kicker)}</span>
            <h2>${escapeHtml(slide.headline)}</h2>
            <div class="stairs-wrap">
              ${slide.stairs.map((stair, stairIndex) => `
                <div class="stair ${stairIndex === slide.stairs.length - 1 ? "is-peak" : ""}">
                  <div class="stair-step">${escapeHtml(stair[0])}</div>
                  <div class="stair-title">${escapeHtml(stair[1])}</div>
                  <div class="stair-body">${escapeHtml(stair[2])}</div>
                </div>
              `).join("")}
            </div>
            ${slide.conclusion ? `<p class="stairs-conclusion">${escapeHtml(slide.conclusion)}</p>` : ""}
          </div>`;
      }

      return "";
    };

    // Presentation-room wave 1 is deliberately narrow: only compact card/grid slides
    // with enough vertical room. Full analysis, diagnosis and source-heavy slides stay
    // unchanged until individually reviewed, because broad centering can crop headlines.
    // Intro restructure removed three early slides; number-based layout sets below follow
    // the retained slide objects after their new positions.
    const roomChartWithHeadlineSlides = new Set([]);
    const roomGridCenteredSlides = new Set([58]);

    // Vertical reference wave: align the reviewed transition and inventory slides to
    // the slide-38 top baseline without changing the already approved slide range.
    const verticalReferenceSlides = new Set([63, 64, 66, 67, 68, 69, 70]);
    const verticalBalanceDownSlides = new Set([3, 26, 62, 63, 66, 88]);
    const verticalBalanceSoftSlides = new Set([65]);
    const verticalBalanceStrongSlides = new Set([88]);
    const assetInventorySlideTitles = new Set(["Bestand · Content", "Bestand · Context", "Bestand · Connect", "Bestand · Checkout"]);

    const getRoomLayoutClass = (slideNumber, slide) => {
      const classes = [];
      if (roomChartWithHeadlineSlides.has(slideNumber)) classes.push("room-chart-with-headline");
      if (roomGridCenteredSlides.has(slideNumber)) classes.push("room-grid-centered");
      if (verticalReferenceSlides.has(slideNumber)) classes.push("vertical-reference");
      if (verticalBalanceDownSlides.has(slideNumber)) classes.push("vertical-balance-down");
      if (verticalBalanceSoftSlides.has(slideNumber)) classes.push("vertical-balance-soft");
      if (verticalBalanceStrongSlides.has(slideNumber)) classes.push("vertical-balance-strong");
      if (assetInventorySlideTitles.has(slide.title)) classes.push("asset-inventory-balanced", "asset-inventory-room");
      return classes.join(" ");
    };

    slides.forEach((slide, i) => {
      const section = document.createElement("section");
      const slideClasses = ["slide", slide.theme || "light", i === 0 ? "is-active" : ""];
      const roomLayoutClass = getRoomLayoutClass(i + 1, slide);
      if (roomLayoutClass) slideClasses.push(roomLayoutClass);
      if (slide.photoDivider) slideClasses.push("photo-divider");
      if (slide.videoFullBleed) slideClasses.push("avatar-video-slide");
      section.className = slideClasses.filter(Boolean).join(" ");
      if (slide.photoDivider) section.style.setProperty("--divider-photo", `url('${escapeHtml(slide.photoDivider)}')`);
      section.dataset.title = slide.title;
      section.innerHTML = `${renderTopline(slide, i)}${renderSlideInner(slide)}${renderFootline(i)}<aside hidden>${escapeHtml(slide.note || "")}</aside>`;
      deck.appendChild(section);

      const button = document.createElement("button");
      button.type = "button";
      button.innerHTML = `<small>${String(i + 1).padStart(2, "0")}</small><span>${escapeHtml(slide.title)}</span>`;
      button.addEventListener("click", () => {
        overview.classList.remove("is-visible");
        update(i);
      });
      overviewGrid.appendChild(button);
    });

    const sections = Array.from(document.querySelectorAll(".slide"));

    const stopVideo = (video, reset = true) => {
      if (!video) return;
      video.pause();
      if (reset && Number.isFinite(video.duration)) {
        try { video.currentTime = 0; } catch (error) { /* ignore seek errors while metadata loads */ }
      }
    };

    const syncSlideMedia = ({ resetActive = true } = {}) => {
      sections.forEach((section, sectionIndex) => {
        section.querySelectorAll("video[data-slide-autoplay]").forEach((video) => {
          const isActiveVideo = sectionIndex === index && document.visibilityState !== "hidden";
          if (!isActiveVideo) {
            stopVideo(video);
            return;
          }
          if (resetActive) {
            try { video.currentTime = 0; } catch (error) { /* ignore seek errors while metadata loads */ }
          }
          const playAttempt = video.play();
          if (playAttempt && typeof playAttempt.catch === "function") {
            playAttempt.catch(() => {
              video.dataset.autoplayBlocked = "true";
            });
          }
        });
      });
    };

    const updateNotes = () => {
      const note = sections[index].querySelector("aside")?.textContent || "Keine Notiz hinterlegt.";
      notesPanel.innerHTML = `<strong>Sprechernotiz</strong>${escapeHtml(note)}`;
      notesPanel.classList.toggle("is-visible", notesVisible);
    };

    const updateAgendaReveal = () => {
      const slide = slides[index];
      if (!slide || slide.kind !== "agenda") return;
      const activeSection = sections[index];
      activeSection.querySelectorAll(".agenda-block").forEach((block) => {
        const blockIndex = Number(block.dataset.agendaBlock);
        const isRevealed = blockIndex <= agendaReveal;
        const isCurrent = blockIndex === agendaReveal;
        block.classList.toggle("is-revealed", isRevealed);
        block.classList.toggle("is-hidden", !isRevealed);
        block.classList.toggle("is-current", isCurrent);
        block.classList.toggle("is-future", !isCurrent);
      });
    };

    const updateCardReveal = () => {
      const slide = slides[index];
      if (!slide || !slide.revealCards) return;
      const activeSection = sections[index];
      activeSection.querySelectorAll("[data-reveal-card]").forEach((card) => {
        const cardIndex = Number(card.dataset.revealCard);
        card.classList.toggle("is-hidden", cardIndex >= cardReveal);
      });
      activeSection.querySelector(".cards-outro")?.classList.toggle("is-hidden", cardReveal < slide.cards.length);
    };

    const update = (nextIndex, pushHash = true) => {
      index = Math.max(0, Math.min(sections.length - 1, nextIndex));
      agendaReveal = slides[index]?.kind === "agenda" ? (slides[index].revealIndex ?? -1) : -1;
      cardReveal = slides[index]?.revealCards ? (slides[index].revealIndex ?? 0) : 0;
      sections.forEach((section, sectionIndex) => {
        section.classList.toggle("is-active", sectionIndex === index);
      });
      updateAgendaReveal();
      updateCardReveal();
      progress.style.width = `${((index + 1) / sections.length) * 100}%`;
      const title = sections[index].dataset.title || `Folie ${index + 1}`;
      document.title = `${String(index + 1).padStart(2, "0")} · ${title} · KStA.Connect Offsite`;
      if (pushHash) {
        window.history.replaceState(null, "", `#${index + 1}-${slug(title)}`);
      }
      syncSlideMedia();
      updateNotes();
    };

    const next = () => {
      const slide = slides[index];
      if (slide?.kind === "agenda" && Number.isInteger(slide.revealIndex) && agendaReveal < slide.blocks.length - 1) {
        agendaReveal += 1;
        updateAgendaReveal();
        return;
      }
      if (slide?.revealCards && cardReveal < slide.cards.length) {
        cardReveal += 1;
        updateCardReveal();
        return;
      }
      update(index + 1);
    };

    const prev = () => {
      const slide = slides[index];
      if (slide?.kind === "agenda" && Number.isInteger(slide.revealIndex) && agendaReveal >= 0) {
        agendaReveal -= 1;
        updateAgendaReveal();
        return;
      }
      if (slide?.revealCards && cardReveal > 0) {
        cardReveal -= 1;
        updateCardReveal();
        return;
      }
      update(index - 1);
    };

    const fromHash = () => {
      const hash = window.location.hash || "";
      const slugMatch = hash.match(/^#(?:\d+)-(.+)$/);
      if (slugMatch) {
        const targetSlug = slugMatch[1];
        const slugIndex = sections.findIndex((section) => slug(section.dataset.title || "") === targetSlug);
        if (slugIndex >= 0) {
          update(slugIndex, false);
          return;
        }
      }
      const match = hash.match(/^#(\d+)/);
      update(match ? Number(match[1]) - 1 : 0, false);
    };

    document.querySelector("[data-prev]").addEventListener("click", prev);
    document.querySelector("[data-next]").addEventListener("click", next);
    document.querySelector("[data-overview]").addEventListener("click", () => overview.classList.toggle("is-visible"));

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        sections.forEach((section) => section.querySelectorAll("video[data-slide-autoplay]").forEach((video) => stopVideo(video, false)));
        return;
      }
      syncSlideMedia({ resetActive: false });
    });

    document.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        next();
      }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) {
        event.preventDefault();
        prev();
      }
      if (event.key === "Home") update(0);
      if (event.key === "End") update(sections.length - 1);
      if (event.key.toLowerCase() === "o") overview.classList.toggle("is-visible");
      if (event.key.toLowerCase() === "n") {
        notesVisible = !notesVisible;
        updateNotes();
      }
      if (event.key === "Escape") {
        overview.classList.remove("is-visible");
        notesVisible = false;
        updateNotes();
      }
    });

    let touchStartX = null;
    document.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    document.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 44) (delta < 0 ? next() : prev());
      touchStartX = null;
    }, { passive: true });

    window.addEventListener("hashchange", fromHash);
    fromHash();
  </script>
</body>
</html>
