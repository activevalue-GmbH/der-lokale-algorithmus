<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KStA.Connect | Präsentationsstruktur Offsite</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Arbeitsfassung der Offsite-Präsentation zu KStA.Connect.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #c8000e;
      --ink: #1c1917;
      --body: #3d3a38;
      --muted: #77716c;
      --paper: #fafaf8;
      --paper-2: #f2f0ed;
      --warm: #f5e6d3;
      --blue: #526d82;
      --green: #66765f;
      --line: rgba(28, 25, 23, 0.16);
      --line-dark: rgba(250, 250, 248, 0.16);
      --serif: "DM Serif Display", Georgia, serif;
      --sans: "DM Sans", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--body);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button {
      border: 0;
      font: inherit;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--paper);
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(14px, 2vw, 28px);
      padding: clamp(24px, 4.1vw, 58px);
      background: var(--paper);
      opacity: 0;
      pointer-events: none;
      transform: translateX(28px);
      transition: opacity 300ms ease, transform 300ms ease;
    }

    .slide.is-active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .slide.dark {
      background: var(--ink);
      color: rgba(250, 250, 248, 0.72);
    }

    .slide.grey {
      background: var(--paper-2);
    }

    .slide.warm {
      background: linear-gradient(180deg, var(--paper), var(--warm));
    }

    .slide.red {
      background: var(--red);
      color: rgba(250, 250, 248, 0.84);
    }

    .red .topline,
    .red .footline {
      color: rgba(250, 250, 248, 0.58);
    }

    .red .kicker {
      color: rgba(250, 250, 248, 0.84);
    }

    .red h1,
    .red h2,
    .red .statement,
    .red .quote,
    .red .persona-name,
    .red .block-number {
      color: var(--paper);
    }

    .topline,
    .footline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 700;
      letter-spacing: 0.13em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .dark .topline,
    .dark .footline {
      color: rgba(250, 250, 248, 0.42);
    }

    .footline {
      justify-content: flex-end;
    }

    .brand span {
      color: var(--red);
      margin-right: 7px;
    }

    .content {
      display: grid;
      align-content: center;
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: clamp(18px, 3vw, 40px) 0;
    }

    .content.narrow {
      width: min(100%, 930px);
    }

    .content.top {
      align-content: start;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(330px, 0.8fr);
      gap: clamp(34px, 5.2vw, 78px);
      align-items: center;
    }

    .split.split-headline-compact h2 {
      max-width: 960px;
      font-size: clamp(34px, 4.55vw, 64px);
      line-height: 1.02;
    }

    .kicker {
      display: block;
      margin-bottom: clamp(16px, 2vw, 26px);
      color: var(--red);
      font-size: clamp(13px, 1.35vw, 16px);
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    h1,
    h2,
    .statement,
    .quote,
    .persona-name,
    .block-number {
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 400;
      letter-spacing: 0;
    }

    .dark h1,
    .dark h2,
    .dark .statement,
    .dark .quote,
    .dark .persona-name,
    .dark .block-number {
      color: var(--paper);
    }

    h1 {
      max-width: 1040px;
      font-size: clamp(50px, 7.7vw, 114px);
      line-height: 0.96;
    }

    h1 em,
    h2 em,
    .statement em {
      color: rgba(28, 25, 23, 0.32);
      font-style: italic;
    }

    .dark h1 em,
    .dark h2 em,
    .dark .statement em {
      color: rgba(250, 250, 248, 0.34);
    }

    h2,
    .statement {
      max-width: 1040px;
      font-size: clamp(36px, 5vw, 72px);
      line-height: 1.04;
    }

    .statement-marker {
      display: inline-grid;
      place-items: center;
      width: clamp(42px, 4.3vw, 58px);
      height: clamp(42px, 4.3vw, 58px);
      margin-bottom: clamp(18px, 2.2vw, 28px);
      border: 1px solid rgba(200, 0, 14, 0.72);
      border-radius: 999px;
      color: var(--red);
      font-family: var(--sans);
      font-size: clamp(22px, 2.2vw, 30px);
      font-weight: 500;
      line-height: 1;
    }

    .dark .statement-marker {
      border-color: rgba(250, 250, 248, 0.28);
      color: var(--paper);
    }

    .lead {
      max-width: 760px;
      margin-top: clamp(22px, 2.6vw, 36px);
      color: var(--body);
      font-size: clamp(19px, 1.7vw, 26px);
      font-weight: 300;
      line-height: 1.43;
    }

    .dark .lead {
      color: rgba(250, 250, 248, 0.64);
    }

    .cards-lead {
      max-width: 880px;
      margin-top: clamp(16px, 1.8vw, 24px);
      font-size: clamp(18px, 1.35vw, 22px);
    }

    .cards-outro {
      max-width: 920px;
      margin-top: clamp(22px, 2.4vw, 32px);
      color: var(--body);
      font-size: clamp(18px, 1.35vw, 22px);
      font-weight: 500;
      line-height: 1.42;
    }

    .dark .cards-outro {
      color: rgba(250, 250, 248, 0.72);
    }

    .title-details {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, auto));
      gap: clamp(18px, 3vw, 42px);
      max-width: 900px;
      margin-top: clamp(42px, 5vw, 76px);
      padding-top: clamp(22px, 2.4vw, 32px);
      border-top: 1px solid var(--line-dark);
    }

    .title-details span {
      display: block;
      color: rgba(250, 250, 248, 0.36);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .title-details strong {
      display: block;
      margin-top: 7px;
      color: rgba(250, 250, 248, 0.78);
      font-size: clamp(14px, 1.05vw, 17px);
      font-weight: 400;
      line-height: 1.35;
    }

    .copy {
      display: grid;
      gap: 17px;
      max-width: 720px;
      color: var(--body);
      font-size: clamp(17px, 1.32vw, 21px);
      font-weight: 300;
      line-height: 1.56;
    }

    .dark .copy {
      color: rgba(250, 250, 248, 0.64);
    }

    .split-bullets {
      display: grid;
      gap: clamp(16px, 1.7vw, 24px);
      max-width: 760px;
      margin: 0;
      padding-left: 1.08em;
      color: var(--body);
      font-size: clamp(19px, 1.45vw, 24px);
      font-weight: 300;
      line-height: 1.43;
    }

    .dark .split-bullets {
      color: rgba(250, 250, 248, 0.66);
    }

    .split-bullets li::marker {
      color: var(--red);
    }

    .agenda-stack {
      display: grid;
      gap: clamp(16px, 1.9vw, 24px);
      max-width: 1060px;
      margin-top: clamp(26px, 3vw, 42px);
    }

    .agenda-block {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: clamp(18px, 2.4vw, 34px);
      align-items: start;
      padding-left: 0;
      border-left: 0;
    }

    .agenda-heading {
      display: grid;
      gap: 9px;
      align-items: start;
      justify-items: start;
    }

    .agenda-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 10px;
      background: rgba(28, 25, 23, 0.08);
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    .agenda-heading strong {
      color: var(--ink);
      font-size: clamp(17px, 1.35vw, 21px);
      font-weight: 700;
      line-height: 1.2;
    }

    .agenda-lines {
      display: grid;
      gap: 9px;
      padding-left: clamp(18px, 2.4vw, 34px);
      border-left: 2px solid var(--red);
      color: var(--body);
      font-size: clamp(17px, 1.42vw, 22px);
      font-weight: 700;
      line-height: 1.24;
    }

    .agenda-block.is-hidden .agenda-lines {
      visibility: hidden;
    }

    .agenda-block.is-future .agenda-heading {
      opacity: 0.58;
    }

    .agenda-block.is-current .agenda-heading {
      opacity: 1;
    }

    .agenda-block.is-current .agenda-tag {
      background: rgba(200, 0, 14, 0.1);
    }

    .evidence-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.78fr) minmax(340px, 1fr);
      gap: clamp(36px, 5.4vw, 78px);
      align-items: center;
    }

    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .evidence-card.wide-red {
      grid-column: 1 / -1;
      min-height: 170px;
      background: var(--red);
    }

    .evidence-card.wide-red span,
    .evidence-card.wide-red strong,
    .evidence-card.wide-red em,
    .evidence-card.wide-red small {
      color: var(--paper);
    }

    .evidence-card.wide-red strong {
      max-width: 720px;
      font-size: clamp(30px, 3vw, 44px);
      line-height: 1.04;
    }

    .evidence-card.soft-red {
      background: rgba(200, 0, 14, 0.08);
    }

    .evidence-card.dark {
      background: var(--ink);
    }

    .evidence-card.dark span {
      color: rgba(250, 250, 248, 0.74);
    }

    .evidence-card.dark strong {
      color: var(--paper);
    }

    .evidence-card.dark em,
    .evidence-card.dark small {
      color: rgba(250, 250, 248, 0.72);
    }

    .evidence-card {
      display: grid;
      gap: 10px;
      min-height: 140px;
      padding: clamp(20px, 2.2vw, 30px);
      background: rgba(250, 250, 248, 0.84);
    }

    .evidence-card span {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .evidence-card strong {
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(22px, 2vw, 30px);
      font-weight: 400;
      line-height: 1.12;
    }

    .evidence-card small {
      color: var(--muted);
      font-size: clamp(13px, 1vw, 16px);
      line-height: 1.45;
    }

    .evidence-card em {
      color: var(--body);
      font-size: clamp(13px, 1vw, 15px);
      font-style: normal;
      font-weight: 600;
      line-height: 1.4;
    }

    .evidence-card.highlight {
      background: var(--ink);
    }

    .evidence-card.highlight span {
      color: rgba(200, 0, 14, 0.9);
    }

    .evidence-card.highlight strong {
      color: var(--paper);
    }

    .evidence-card.highlight em {
      color: rgba(250, 250, 248, 0.54);
    }

    .evidence-card.highlight small {
      color: rgba(250, 250, 248, 0.72);
    }

    .source-strip {
      margin-top: clamp(24px, 3vw, 40px);
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: clamp(12px, 0.95vw, 14px);
      font-weight: 300;
      line-height: 1.6;
    }

    .jtbd-mirror {
      align-content: center;
    }

    .jtbd-mirror h2 {
      max-width: 940px;
      font-size: clamp(30px, 3.6vw, 52px);
      line-height: 1.08;
    }

    .jtbd-mirror .lead {
      max-width: 780px;
      margin-top: 14px;
      font-size: clamp(15px, 1.25vw, 18px);
    }

    .mirror-grid {
      display: grid;
      gap: 0;
      margin-top: clamp(24px, 3vw, 42px);
      border-top: 2px solid var(--ink);
    }

    .mirror-row,
    .mirror-head {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(110px, 0.48fr) minmax(0, 1.48fr) minmax(0, 1.32fr);
      column-gap: clamp(12px, 1.5vw, 22px);
    }

    .mirror-head {
      padding: 10px 0 9px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mirror-row {
      padding: clamp(9px, 1.05vw, 14px) 0;
      border-bottom: 1px solid var(--line);
      color: var(--body);
      font-size: clamp(11px, 0.95vw, 13px);
      font-weight: 500;
      line-height: 1.32;
    }

    .mirror-phenomenon {
      color: var(--ink);
      font-weight: 700;
    }

    .mirror-phenomenon em {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.88em;
      font-style: normal;
      font-weight: 400;
    }

    .mirror-source {
      color: var(--muted);
      font-style: italic;
    }

    .mirror-consequence strong {
      color: var(--ink);
      font-weight: 700;
    }

    .mirror-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid rgba(28, 25, 23, 0.16);
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .mirror-badge.confirmed {
      background: rgba(102, 118, 95, 0.13);
      color: var(--green);
    }

    .mirror-badge.nuanced {
      background: rgba(82, 109, 130, 0.12);
      color: var(--blue);
    }

    .list {
      display: grid;
      gap: clamp(12px, 1.4vw, 18px);
      list-style: none;
    }

    .list li {
      position: relative;
      padding-left: 24px;
      color: var(--body);
      font-size: clamp(17px, 1.45vw, 22px);
      font-weight: 300;
      line-height: 1.38;
    }

    .list li::before {
      content: "";
      position: absolute;
      top: 0.64em;
      left: 0;
      width: 7px;
      height: 7px;
      background: var(--red);
    }

    .dark .list li {
      color: rgba(250, 250, 248, 0.68);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .cards.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cards.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card {
      display: grid;
      align-content: start;
      gap: 12px;
      min-height: 154px;
      padding: clamp(20px, 2.2vw, 32px);
      background: rgba(250, 250, 248, 0.86);
    }

    .dark .card {
      background: rgba(250, 250, 248, 0.06);
      border-color: var(--line-dark);
    }

    .card.is-highlight {
      position: relative;
      background: rgba(229, 0, 28, 0.11);
      box-shadow: inset 0 0 0 1px rgba(229, 0, 28, 0.48);
    }

    .card.is-highlight::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--red);
    }

    .card.is-muted {
      opacity: 0.44;
      filter: grayscale(0.35);
    }

    .dark .card.is-highlight {
      background: rgba(229, 0, 28, 0.18);
      box-shadow: inset 0 0 0 1px rgba(229, 0, 28, 0.58);
    }

    .card small {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .card strong {
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(22px, 2vw, 30px);
      font-weight: 400;
      line-height: 1.12;
    }

    .dark .card strong {
      color: var(--paper);
    }

    .card span {
      color: var(--muted);
      font-size: clamp(14px, 1.05vw, 16px);
      line-height: 1.5;
    }

    .dark .card span {
      color: rgba(250, 250, 248, 0.62);
    }

    .card-bullets {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card-bullets li {
      position: relative;
      padding-left: 18px;
      color: var(--muted);
      font-size: clamp(14px, 1.05vw, 16px);
      line-height: 1.42;
    }

    .card-bullets li::before {
      content: "";
      position: absolute;
      top: 0.62em;
      left: 0;
      width: 6px;
      height: 6px;
      background: var(--red);
    }

    .dark .card-bullets li {
      color: rgba(250, 250, 248, 0.66);
    }

    .poc-scope {
      align-content: center;
      gap: clamp(22px, 2.6vw, 34px);
    }

    .poc-scope h2 {
      max-width: 1040px;
      font-size: clamp(40px, 5.1vw, 74px);
      line-height: 1.02;
    }

    .poc-scope-subline {
      max-width: 820px;
      color: var(--body);
      font-size: clamp(20px, 1.65vw, 26px);
      font-weight: 300;
      line-height: 1.38;
    }

    .poc-scope-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.9fr 1.2fr;
      gap: 2px;
      max-width: 1120px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .poc-scope-card {
      display: grid;
      align-content: start;
      gap: clamp(12px, 1.4vw, 18px);
      min-height: clamp(154px, 17vw, 218px);
      padding: clamp(22px, 2.6vw, 36px);
      background: rgba(250, 250, 248, 0.8);
    }

    .poc-scope-card small {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .poc-scope-card strong {
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(28px, 3vw, 44px);
      font-weight: 400;
      line-height: 1.05;
    }

    .poc-scope-card span {
      color: var(--muted);
      font-size: clamp(15px, 1.15vw, 18px);
      line-height: 1.45;
    }

    .poc-scope-core {
      max-width: 940px;
      color: var(--body);
      font-size: clamp(20px, 1.75vw, 28px);
      font-weight: 700;
      line-height: 1.34;
    }

    .poc-scope-dual {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 2px;
      max-width: 1120px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .poc-scope-zone {
      display: grid;
      align-content: start;
      gap: clamp(16px, 1.8vw, 24px);
      padding: clamp(24px, 3vw, 42px);
      background: rgba(250, 250, 248, 0.82);
    }

    .poc-scope-zone small {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .poc-scope-zone strong {
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(27px, 2.7vw, 42px);
      font-weight: 400;
      line-height: 1.08;
    }

    .poc-scope-list {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .poc-scope-list li {
      position: relative;
      padding-left: 20px;
      color: var(--body);
      font-size: clamp(15px, 1.18vw, 18px);
      line-height: 1.38;
    }

    .poc-scope-list li::before {
      content: "";
      position: absolute;
      top: 0.62em;
      left: 0;
      width: 7px;
      height: 7px;
      background: var(--red);
    }

    .campaign-action {
      align-content: center;
      gap: clamp(22px, 2.7vw, 38px);
      width: min(100%, 1240px);
    }

    .campaign-action-stage {
      display: grid;
      grid-template-columns: minmax(300px, 0.54fr) minmax(0, 1.12fr);

      transition: opacity 220ms ease, transform 220ms ease;
    }

    .cards.is-auto-reveal .card,
    .cards-outro.is-auto-reveal {
      opacity: 0;
      transform: translateY(14px);
    }

    .slide.is-active .cards.is-auto-reveal .card {
      animation: autoCardReveal 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(260ms + (var(--card-index, 0) * 560ms));

      animation: autoCardReveal 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--outro-delay, 3900ms);
    }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cards.is-auto-reveal .card,
      .cards-outro.is-auto-reveal {

        transform: none;
      }

      }

      if (slide.kind === "valueStairs") {

    slides.forEach((slide, i) => {
      const section = document.createElement("section");

      section.className = slideClasses.filter(Boolean).join(" ");

      section.dataset.title = slide.title;
      section.innerHTML = `${renderTopline(slide, i)}${renderSlideInner(slide)}${renderFootline(i)}<aside hidden>${escapeHtml(slide.note || "")}</aside>`;
      deck.appendChild(section);

      const button = document.createElement("button");
      button.type = "button";
      button.innerHTML = `<small>${String(i + 1).padStart(2, "0")}</small><span>${escapeHtml(slide.title)}</span>`;
      button.addEventListener("click", () => {
        overview.classList.remove("is-visible");
        update(i);
      });
      overviewGrid.appendChild(button);
    });

    const sections = Array.from(document.querySelectorAll(".slide"));

    const stopVideo = (video, reset = true) => {
      if (!video) return;
      video.pause();
      if (reset && Number.isFinite(video.duration)) {
        try { video.currentTime = 0; } catch (error) { /* ignore seek errors while metadata loads */ }
      }
    };

    const syncSlideMedia = ({ resetActive = true } = {}) => {
      sections.forEach((section, sectionIndex) => {
        section.querySelectorAll("video[data-slide-autoplay]").forEach((video) => {
          const isActiveVideo = sectionIndex === index && document.visibilityState !== "hidden";
          if (!isActiveVideo) {
            stopVideo(video);
            return;
          }
          if (resetActive) {
            try { video.currentTime = 0; } catch (error) { /* ignore seek errors while metadata loads */ }
          }
          const playAttempt = video.play();
          if (playAttempt && typeof playAttempt.catch === "function") {
            playAttempt.catch(() => {
              video.dataset.autoplayBlocked = "true";
            });
          }
        });
      });
    };

    const updateNotes = () => {
      const note = sections[index].querySelector("aside")?.textContent || "Keine Notiz hinterlegt.";
      notesPanel.innerHTML = `<strong>Sprechernotiz</strong>${escapeHtml(note)}`;
      notesPanel.classList.toggle("is-visible", notesVisible);
    };

    const updateAgendaReveal = () => {
      const slide = slides[index];
      if (!slide || slide.kind !== "agenda") return;
      const activeSection = sections[index];
      activeSection.querySelectorAll(".agenda-block").forEach((block) => {
        const blockIndex = Number(block.dataset.agendaBlock);
        const isRevealed = blockIndex <= agendaReveal;
        const isCurrent = blockIndex === agendaReveal;
        block.classList.toggle("is-revealed", isRevealed);
        block.classList.toggle("is-hidden", !isRevealed);
        block.classList.toggle("is-current", isCurrent);
        block.classList.toggle("is-future", !isCurrent);
      });
    };

    const updateCardReveal = () => {
      const slide = slides[index];
      if (!slide || !slide.revealCards) return;
      const activeSection = sections[index];
      activeSection.querySelectorAll("[data-reveal-card]").forEach((card) => {
        const cardIndex = Number(card.dataset.revealCard);
        card.classList.toggle("is-hidden", cardIndex >= cardReveal);
      });
      activeSection.querySelector(".cards-outro")?.classList.toggle("is-hidden", cardReveal < slide.cards.length);
    };

    const update = (nextIndex, pushHash = true) => {
      index = Math.max(0, Math.min(sections.length - 1, nextIndex));
      agendaReveal = slides[index]?.kind === "agenda" ? (slides[index].revealIndex ?? -1) : -1;
      cardReveal = slides[index]?.revealCards ? (slides[index].revealIndex ?? 0) : 0;
      sections.forEach((section, sectionIndex) => {
        section.classList.toggle("is-active", sectionIndex === index);
      });
      updateAgendaReveal();
      updateCardReveal();
      progress.style.width = `${((index + 1) / sections.length) * 100}%`;
      const title = sections[index].dataset.title || `Folie ${index + 1}`;
      document.title = `${String(index + 1).padStart(2, "0")} · ${title} · KStA.Connect Offsite`;
      if (pushHash) {
        window.history.replaceState(null, "", `#${index + 1}-${slug(title)}`);
      }
      syncSlideMedia();
      updateNotes();
    };

    const next = () => {
      const slide = slides[index];
      if (slide?.kind === "agenda" && agendaReveal < slide.blocks.length - 1) {
        agendaReveal += 1;
        updateAgendaReveal();
        return;
      }
      if (slide?.revealCards && cardReveal < slide.cards.length) {
        cardReveal += 1;
        updateCardReveal();
        return;
      }
      update(index + 1);
    };

    const prev = () => {
      const slide = slides[index];
      if (slide?.kind === "agenda" && agendaReveal >= 0) {
        agendaReveal -= 1;
        updateAgendaReveal();
        return;
      }
      if (slide?.revealCards && cardReveal > 0) {
        cardReveal -= 1;
        updateCardReveal();
        return;
      }
      update(index - 1);
    };

    const fromHash = () => {
      const hash = window.location.hash || "";
      const slugMatch = hash.match(/^#(?:\d+)-(.+)$/);
      if (slugMatch) {
        const targetSlug = slugMatch[1];
        const slugIndex = sections.findIndex((section) => slug(section.dataset.title || "") === targetSlug);
        if (slugIndex >= 0) {
          update(slugIndex, false);
          return;
        }
      }
      const match = hash.match(/^#(\d+)/);
      update(match ? Number(match[1]) - 1 : 0, false);
    };

    document.querySelector("[data-prev]").addEventListener("click", prev);
    document.querySelector("[data-next]").addEventListener("click", next);
    document.querySelector("[data-overview]").addEventListener("click", () => overview.classList.toggle("is-visible"));
    document.querySelector("[data-notes]").addEventListener("click", () => {
      notesVisible = !notesVisible;
      updateNotes();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        sections.forEach((section) => section.querySelectorAll("video[data-slide-autoplay]").forEach((video) => stopVideo(video, false)));
        return;
      }
      syncSlideMedia({ resetActive: false });
    });

    document.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        next();
      }
      if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) {
        event.preventDefault();
        prev();
      }
      if (event.key === "Home") update(0);
      if (event.key === "End") update(sections.length - 1);
      if (event.key.toLowerCase() === "o") overview.classList.toggle("is-visible");
      if (event.key.toLowerCase() === "n") {
        notesVisible = !notesVisible;
        updateNotes();
      }
      if (event.key === "Escape") {
        overview.classList.remove("is-visible");
        notesVisible = false;
        updateNotes();
      }
    });

    let touchStartX = null;
    document.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    document.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 44) (delta < 0 ? next() : prev());
      touchStartX = null;
    }, { passive: true });

    window.addEventListener("hashchange", fromHash);
    fromHash();
  </script>
</body>
</html>
